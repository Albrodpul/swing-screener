name: Pipeline US

on:
  push:
    branches:
      - main
    paths:
      - 'screener/**'
      - 'data/**/*.py'
      - 'technicals/**'
      - 'fundamentals/**'
      - 'themes/**'
      - 'ci_pipeline.py'
      - 'generate_json.py'
      - 'requirements.txt'
      - 'config.yaml.example'
  schedule:
    # Lunes a viernes a las 21:30 UTC (tras cierre NYSE/NASDAQ)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Cache datos screener
        uses: actions/cache@v4
        with:
          path: cache/
          key: screener-us-${{ github.run_id }}
          restore-keys: |
            screener-us-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear config.yaml
        run: cp config.yaml.example config.yaml

      - name: Ejecutar pipeline US
        run: python ci_pipeline.py --market us

      - name: Generar JSON para frontend
        run: python generate_json.py

      - name: Commit resultado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_run_us.parquet web/public/last_run.json
          git diff --staged --quiet && echo "Sin cambios" || \
            git commit -m "data: pipeline US $(date -u +%Y-%m-%d)" && \
            git pull --rebase -X ours origin main && git push

      - name: Notificar Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py
